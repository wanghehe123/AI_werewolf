# AI 狼人杀 LLM 配置文件
# =========================
# 支持配置多个 LLM Provider，并为不同游戏角色绑定不同的模型。
# 所有 OpenAI 兼容接口（OpenAI、DeepSeek、通义千问、Ollama 等）均可使用。
#
# 使用方式：
#   1. 复制此文件，填写你的 API Key 环境变量名
#   2. 通过环境变量 LLM_CONFIG_PATH 指定配置文件路径，默认读取本文件
#   3. 通过环境变量设置对应的 API Key（如 export DEEPSEEK_API_KEY=sk-xxx）
#
# Provider 类型说明：
#   - openai_compatible: OpenAI 兼容接口，支持 OpenAI / DeepSeek / 通义千问 / Ollama 等
#   - fake: 内置假模型，用于测试和开发，不调用真实 API

# ==================== Provider 配置 ====================
# 每个 Provider 定义一个可用的 LLM 模型服务
providers:
  # ---- DeepSeek（推荐，性价比高）----
  - id: deepseek
    type: openai_compatible
    model_name: deepseek-v4-flash       # DeepSeek V3 模型
    base_url: https://api.deepseek.com/chat/completions
    api_key_env: DEEPSEEK_API_KEY    # 从环境变量 DEEPSEEK_API_KEY 读取密钥
    temperature: 0.8                 # 生成温度，越高越随机（0.0-2.0）
    max_tokens: 1024                 # 单次回复最大 token 数
    timeout: 30                      # 请求超时（秒）

  # ---- OpenAI 官方 ----
  # - id: openai
  #   type: openai_compatible
  #   model_name: gpt-4o-mini
  #   base_url: https://api.openai.com/v1
  #   api_key_env: OPENAI_API_KEY
  #   temperature: 0.8
  #   max_tokens: 1024
  #   timeout: 30

  # ---- 通义千问 ----
  # - id: qwen
  #   type: openai_compatible
  #   model_name: qwen-plus
  #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   api_key_env: DASHSCOPE_API_KEY
  #   temperature: 0.8
  #   max_tokens: 1024
  #   timeout: 30

  # ---- 智谱 GLM ----
  - id: glm
    type: openai_compatible
    model_name: glm-4.7         # 智谱 GLM-4 模型
    base_url: https://open.bigmodel.cn/api/paas/v4/chat/completions
    api_key_env: ZHIPU_API_KEY       # 从环境变量 ZHIPU_API_KEY 读取密钥
    temperature: 0.8
    max_tokens: 1024
    timeout: 30

  # ---- MiniMax ----
  - id: minimax
    type: openai_compatible
    model_name: MiniMax-M2.7     # MiniMax Text 模型
    base_url: https://api.minimaxi.com/v1
    api_key_env: MINIMAX_API_KEY      # 从环境变量 MINIMAX_API_KEY 读取密钥
    temperature: 0.8
    max_tokens: 1024
    timeout: 30

  # ---- 假模型（测试用，不调用真实 API）----
  - id: fake
    type: fake
    model_name: fake-default


# ==================== 角色绑定 ====================
# 为每个游戏角色指定使用哪个 Provider
# AI 玩家在扮演该角色时，会使用对应 Provider 的模型进行决策和发言
role_bindings:
  werewolf: deepseek        # 狼人角色使用 DeepSeek
  seer: deepseek            # 预言家角色使用 DeepSeek
  witch: minimax           # 女巫角色使用 DeepSeek
  hunter: deepseek          # 猎人角色使用 DeepSeek
  villager: minimax        # 平民角色使用 DeepSeek


# ==================== 全局默认 ====================
# 当角色未在 role_bindings 中配置时，使用此默认 Provider
default_provider: fake
