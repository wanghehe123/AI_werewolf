# AI 狼人杀 LLM 配置文件
# =========================
# 支持配置多个 LLM Provider，并为不同游戏角色绑定不同的模型。
# 所有 OpenAI 兼容接口（OpenAI、DeepSeek、通义千问、Ollama 等）均可使用。
#
# 使用方式：
#   1. 将 API Key 直接写在下方 api_key 字段中（个人开发用，无需环境变量）
#   2. 也可用 api_key_env 从环境变量读取（生产环境推荐）
#   3. 优先级：api_key > api_key_env 环境变量
#
# Provider 类型说明：
#   - openai_compatible: OpenAI 兼容接口，支持 OpenAI / DeepSeek / 通义千问 / Ollama 等
#   - fake: 内置假模型，用于测试和开发，不调用真实 API

# ==================== Provider 配置 ====================
# 每个 Provider 定义一个可用的 LLM 模型服务
providers:
  # ---- DeepSeek（推荐，性价比高）----
  - id: deepseek
    type: openai_compatible
    model_name: deepseek-v4-flash       # DeepSeek V3 模型
    base_url: https://api.deepseek.com
    api_key: sk-ba862ff615e5480aab116946d0b33db3
    temperature: 0.8                 # 生成温度，越高越随机（0.0-2.0）
    max_tokens: 1024                 # 单次回复最大 token 数
    timeout: 30                      # 请求超时（秒）

  # ---- 智谱 GLM ----
  - id: glm
    type: openai_compatible
    model_name: glm-4.7         # 智谱 GLM-4 模型
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key: 83ca0a13383f418baec1c13a1a11b949.1BY4hkXIpDnAm1nD
    temperature: 0.8
    max_tokens: 1024
    timeout: 30

  # ---- MiniMax ----
  - id: minimax
    type: openai_compatible
    model_name: MiniMax-M2.7     # MiniMax Text 模型
    base_url: https://api.minimaxi.com/v1
    api_key: sk-cp-GxDO-5KN1E_TIj6SIsZe5DT07R4V_zpKfI7EVXe8I1eY5y5M4suB8AG4knkzjKaIdP7rh9VJkDJNmhYY7tdEb5e4cuV79w--Kn8fKnix_JgGK1ylwEH-tPs
    temperature: 0.8
    max_tokens: 1024
    timeout: 30

  # ---- 假模型（测试用，不调用真实 API）----
  - id: fake
    type: fake
    model_name: fake-default


# ==================== 角色绑定 ====================
# 为每个游戏角色指定使用哪个 Provider
# AI 玩家在扮演该角色时，会使用对应 Provider 的模型进行决策和发言
role_bindings:
  werewolf: minimax         # 狼人角色使用 MiniMax
  seer: minimax             # 预言家角色使用 MiniMax
  witch: minimax            # 女巫角色使用 MiniMax
  hunter: minimax           # 猎人角色使用 MiniMax
  villager: minimax         # 平民角色使用 MiniMax


# ==================== 全局默认 ====================
# 当角色未在 role_bindings 中配置时，使用此默认 Provider
default_provider: fake


# ==================== 降级链 ====================
# 4-tier degradation: primary -> secondary -> cheap_fallback -> static rule engine
chains:
  default:
    - tier: primary
      provider: deepseek
      timeout_ms: 6000
      max_retries: 1
      triggers_to_next: [timeout, 5xx, 429, json_parse_error]
    - tier: secondary
      provider: deepseek
      timeout_ms: 4000
      max_retries: 1
      triggers_to_next: [timeout, 5xx]
    - tier: cheap_fallback
      provider: deepseek
      timeout_ms: 3000
      max_retries: 0
      triggers_to_next: [always]
    - tier: static
      provider: rule_engine
      timeout_ms: 50
      max_retries: 0
