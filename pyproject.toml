[project]
name = "ai-werewolf"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "sqlmodel",
  "psycopg[binary]",
  "langgraph",
  "openai>=1.0",
  "orjson",
  "pyyaml>=6.0",
  "pytest",
  "pytest-asyncio",
  "redis>=5",
  "httpx",
  "websockets"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["ai_werewolf*"]

[tool.setuptools.package-data]
"ai_werewolf.llm.prompts" = ["templates/**/*.st"]
