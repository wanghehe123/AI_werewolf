[project]
name = "ai-werewolf"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "sqlmodel",
  "psycopg[binary]",
  "langgraph",
  "pytest",
  "pytest-asyncio",
  "httpx"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["ai_werewolf*"]
